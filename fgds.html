<!DOCTYPE html>
<html lang="ru">
<head>
  <link rel="icon" href="favicon.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Какой ФГДС сегодня ты?</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      color: #222;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    body.dark {
      background: #0d1117;
      color: #c9d1d9;
    }

    .wrap {
      width: 100%;
      max-width: 560px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
      gap: 10px;
    }

    a {
      text-decoration: none;
      color: #0066cc;
    }

    a:hover {
      text-decoration: underline;
    }

    body.dark a {
      color: #58a6ff;
    }

    .theme-toggle {
      cursor: pointer;
      font-size: 22px;
      user-select: none;
    }

    .card {
      background: rgba(255,255,255,0.55);
      border: 1px solid rgba(0,0,0,0.08);
      border-radius: 18px;
      padding: 22px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.05);
    }

    body.dark .card {
      background: rgba(255,255,255,0.04);
      border-color: rgba(255,255,255,0.08);
      box-shadow: none;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 32px;
      line-height: 1.05;
    }

    .sub {
      margin: 0 0 18px;
      opacity: 0.8;
      line-height: 1.4;
    }

    .controls {
      display: flex;
      gap: 14px;
      align-items: center;
      margin-bottom: 22px;
      flex-wrap: wrap;
    }

    .fish-dice {
      width: 88px;
      height: 88px;
      border-radius: 20px;
      border: 3px solid rgba(0,0,0,0.12);
      background: #fffaf0;
      color: #222;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.10);
      transform-origin: center;
      cursor: pointer;
      user-select: none;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .fish-dice:hover {
      transform: scale(1.03);
      box-shadow: 0 10px 24px rgba(0,0,0,0.14);
    }

    .fish-dice:active {
      transform: scale(0.97);
    }

    .fish-dice.rolling {
      animation: diceRoll 0.14s linear infinite;
    }

    @keyframes diceRoll {
      0%   { transform: rotate(-10deg) scale(0.94); }
      25%  { transform: rotate(12deg) scale(1.04); }
      50%  { transform: rotate(-8deg) scale(0.97); }
      75%  { transform: rotate(9deg) scale(1.05); }
      100% { transform: rotate(-10deg) scale(0.94); }
    }

    .controls-text {
      font-size: 14px;
      opacity: 0.72;
      line-height: 1.35;
    }

    .grid {
      display: grid;
      gap: 12px;
    }

    .row {
      display: grid;
      grid-template-columns: 62px 1fr;
      gap: 12px;
      align-items: stretch;
    }

    .letter-box {
      border-radius: 14px;
      background: #222;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      font-weight: 700;
      min-height: 68px;
      letter-spacing: 1px;
    }

    body.dark .letter-box {
      background: #c9d1d9;
      color: #111;
    }

    .word-main {
      border-radius: 14px;
      border: 2px solid rgba(0,0,0,0.10);
      min-height: 68px;
      display: flex;
      align-items: center;
      padding: 0 16px;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 0.3px;
      background:
        linear-gradient(to right, rgba(0,0,0,0.03) 1px, transparent 1px);
      background-size: 32px 100%;
      overflow: hidden;
      position: relative;
    }

    body.dark .word-main {
      border-color: rgba(255,255,255,0.12);
      background:
        linear-gradient(to right, rgba(255,255,255,0.05) 1px, transparent 1px);
      background-size: 32px 100%;
    }

    .word {
      position: relative;
      z-index: 2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .word-main.flash,
    .letter-box.flash {
      animation: flashBox 0.35s ease;
    }

    @keyframes flashBox {
      0%   { transform: scale(0.98); opacity: 0.75; }
      50%  { transform: scale(1.01); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }

    .hint {
      margin-top: 14px;
      opacity: 0.72;
      line-height: 1.4;
      font-size: 14px;
    }

    @media (max-width: 560px) {
      h1 {
        font-size: 28px;
      }

      .fish-dice {
        width: 76px;
        height: 76px;
        font-size: 42px;
      }

      .word-main {
        font-size: 20px;
        min-height: 62px;
      }

      .letter-box {
        min-height: 62px;
        font-size: 26px;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <a href="index.html">назад</a>
      <div class="theme-toggle" onclick="toggleTheme()" id="themeIcon">🌙</div>
    </div>

    <div class="card">
      <h1>Какой ФГДС сегодня ты?</h1>
      <p class="sub">Жми на рыбу и получай новую внятную расшифровку ФГДС.</p>

      <div class="controls">
        <div class="fish-dice" id="fishDice" onclick="spinFGDS()" title="крутить">🐡</div>
        <div class="controls-text">тык по рыбе = копчение</div>
      </div>

      <div class="grid">
        <div class="row">
          <div class="letter-box" id="letterF">Ф</div>
          <div class="word-main" id="boxF"><span class="word" id="wordF">...</span></div>
        </div>

        <div class="row">
          <div class="letter-box" id="letterG">Г</div>
          <div class="word-main" id="boxG"><span class="word" id="wordG">...</span></div>
        </div>

        <div class="row">
          <div class="letter-box" id="letterD">Д</div>
          <div class="word-main" id="boxD"><span class="word" id="wordD">...</span></div>
        </div>

        <div class="row">
          <div class="letter-box" id="letterS">С</div>
          <div class="word-main" id="boxS"><span class="word" id="wordS">...</span></div>
        </div>
      </div>

      <div class="hint">каждый раз новая скумбрийная сущность. без совсем дикой фонетической хуйни, но с правильным духом.</div>
    </div>
  </div>

  <script>
    const icon = document.getElementById("themeIcon");
    const fishDice = document.getElementById("fishDice");

    const words = {
      F: [
        "Фанаты",
        "Федерация",
        "Философы",
        "Флотилия",
        "Формация",
        "Феномены",
        "Фантомы",
        "Фристайлеры",
        "Факиры",
        "Флагманы",
        "Форсажники",
        "Флибустьеры",
        "Фундаменталисты",
        "Фронтовики",
        "Фартовые",
        "Фигуранты",
        "Фантазеры",
        "Фурии",
        "Фанатики",
        "Флагелланты",
        "Фокусники",
        "Фуражиры",
        "Факелоносцы",
        "Фрилансеры",
        "Фан-клуб"
      ],
      G: [
        "Грязи",
        "Гравия",
        "Гедонизма",
        "Грунтов",
        "Гонок",
        "Гор",
        "Гари",
        "Голода",
        "Галопа",
        "Гудежа",
        "Груза",
        "Глубины",
        "Героизма",
        "Гребеней",
        "Гула",
        "Гонева",
        "Гарища",
        "Глэма",
        "Грохота",
        "Градуса",
        "Гулянки",
        "Гама",
        "Грохота",
        "Гармонии",
        "Гонева"
      ],
      D: [
        "Дикой",
        "Дорог",
        "Дури",
        "Дальнобойности",
        "Движухи",
        "Дистанции",
        "Доблести",
        "Дерзости",
        "Динамики",
        "Драмы",
        "Долбежки",
        "Дисциплины",
        "Дальняков",
        "Дурищи",
        "Дорожности",
        "Душевности",
        "Дребезги",
        "Движухи",
        "Душнилы",
        "Драйва",
        "Декора",
        "Дождины",
        "Движа",
        "Дымки",
        "Добротности"
      ],
      S: [
        "Скорости",
        "Скумбрии",
        "Свободы",
        "Страда",
        "Стаи",
        "Соли",
        "Смелости",
        "Сквозняка",
        "Силы",
        "Солнцепека",
        "Стали",
        "Судьбы",
        "Срыва",
        "Сервиса",
        "Скитаний",
        "Сумрака",
        "Срывача",
        "Самоиронии",
        "Слэма",
        "Смеха",
        "Сюжета",
        "Сажи",
        "Сезона",
        "Смысла",
        "Собранности"
      ]
    };

    const fishFaces = [
      "🐟", "🐠", "🐡", "🦈", "🐬", "🐋", "🐳", "🦭", "🪼", "🦑",
      "🦐", "🦞", "🦀", "🐙", "🐋", "🐠", "🐟", "🐡", "🦈", "🐬"
    ];

    function setIcon() {
      icon.textContent = document.body.classList.contains("dark") ? "☀️" : "🌙";
    }

    function toggleTheme() {
      document.body.classList.toggle("dark");
      localStorage.setItem("theme", document.body.classList.contains("dark") ? "dark" : "light");
      setIcon();
    }

    if (localStorage.getItem("theme") === "dark") {
      document.body.classList.add("dark");
    }

    setIcon();

    function randomItem(arr) {
      return arr[Math.floor(Math.random() * arr.length)];
    }

    function animateBox(letter) {
      const box = document.getElementById("box" + letter);
      const mainLetter = document.getElementById("letter" + letter);

      box.classList.remove("flash");
      mainLetter.classList.remove("flash");
      void box.offsetWidth;
      void mainLetter.offsetWidth;
      box.classList.add("flash");
      mainLetter.classList.add("flash");
    }

    function setWord(letter, value) {
      document.getElementById("word" + letter).textContent = value;
      animateBox(letter);
    }

    function rollDiceAnimation(duration = 1500) {
      fishDice.classList.add("rolling");

      const interval = setInterval(() => {
        fishDice.textContent = randomItem(fishFaces);
      }, 90);

      setTimeout(() => {
        clearInterval(interval);
        fishDice.classList.remove("rolling");
        fishDice.textContent = randomItem(fishFaces);
      }, duration);
    }

    function spinFGDS() {
      if (fishDice.classList.contains("rolling")) return;

      rollDiceAnimation();

      const f = randomItem(words.F);
      const g = randomItem(words.G);
      const d = randomItem(words.D);
      const s = randomItem(words.S);

      const spinSteps = [
        () => setWord("F", f),
        () => setWord("G", g),
        () => setWord("D", d),
        () => setWord("S", s)
      ];

      spinSteps.forEach((step, index) => {
        setTimeout(step, 350 + index * 220);
      });
    }

    spinFGDS();
  </script>
</body>
</html>
