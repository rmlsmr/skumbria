<div id="map" style="width:100%; height:760px;"></div>

<script>
  const trips = [
    {
      id: "samara",
      title: "Самара",
      type: "past",
      coords: [53.1959, 50.1008],
      date: "База",
      text: "Отсюда скумбрийная стая чаще всего и выдвигается."
    },
    {
      id: "bashkiria",
      title: "Башкирия",
      type: "future",
      coords: [54.7348, 55.9578],
      date: "8–12 мая",
      text: "Плацкарт, хостел, пыль дорог и кофе из Пятерки."
    }
  ];

  let map;
  const placemarks = {};

  ymaps.ready(init);

  function init() {
    map = new ymaps.Map("map", {
      center: [53.5, 55.0],
      zoom: 5,
      controls: ["zoomControl"]
    });

    trips.forEach(trip => {
      const color = trip.type === "future" ? "orange" : "blue";

      const placemark = new ymaps.Placemark(
        trip.coords,
        {
          balloonContent: `
            <b>${trip.title}</b><br>
            ${trip.date}<br><br>
            ${trip.text}
          `,
          hintContent: trip.title
        },
        {
          preset: color === "orange"
            ? "islands#orangeIcon"
            : "islands#blueIcon"
        }
      );

      map.geoObjects.add(placemark);
      placemarks[trip.id] = placemark;
    });
  }
</script>
