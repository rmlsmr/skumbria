<!doctype html>
<html lang="ru">
<head>

  <title>Велогонки 2026 — Скумбрия</title>

  <script src="https://api-maps.yandex.ru/2.1/?lang=ru_RU" type="text/javascript"></script>

  <style>
    :root {
      --bg: #f3f3f0;
      --panel: #ffffff;
      --text: #1d1d1f;
      --muted: #707070;
      --line: #deded8;
      --accent: #0066cc;
      --accent-soft: #e8f1ff;
      --danger: #9b2c2c;
      --shadow: 0 10px 30px rgba(0,0,0,.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    a {
      color: var(--accent);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .app {
      display: grid;
      grid-template-columns: 420px 1fr;
      height: 100vh;
      overflow: hidden;
    }

    .sidebar {
      background: var(--panel);
      border-right: 1px solid var(--line);
      overflow-y: auto;
      padding: 18px;
      box-shadow: var(--shadow);
      z-index: 5;
    }

    .map-wrap {
      position: relative;
      min-width: 0;
    }

    #map {
      width: 100%;
      height: 100vh;
    }

    .title {
      margin: 0 0 6px;
      font-size: 25px;
      line-height: 1.1;
      letter-spacing: -0.03em;
    }

    .subtitle {
      margin: 0 0 16px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.4;
    }

    .controls {
      display: grid;
      gap: 10px;
      margin-bottom: 14px;
    }

    .search {
      width: 100%;
      padding: 12px 13px;
      border: 1px solid var(--line);
      border-radius: 12px;
      font-size: 15px;
      outline: none;
      background: #fafafa;
    }

    .search:focus {
      border-color: var(--accent);
      background: #fff;
    }

    .filters {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 12px;
      font-size: 14px;
      background: #fafafa;
      outline: none;
    }

    .stats {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin: 12px 0 14px;
    }

    .pill {
      border: 1px solid var(--line);
      background: #fafafa;
      color: var(--muted);
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 12px;
      white-space: nowrap;
    }

    .list {
      display: grid;
      gap: 10px;
      padding-bottom: 24px;
    }

    .card {
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 13px;
      cursor: pointer;
      background: #fff;
      transition: transform .12s ease, border-color .12s ease, background .12s ease;
    }

    .card:hover {
      transform: translateY(-1px);
      border-color: #b9cce8;
      background: #fbfdff;
    }

    .card.active {
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: flex-start;
      margin-bottom: 7px;
    }

    .event-name {
      margin: 0;
      font-size: 16px;
      line-height: 1.2;
      font-weight: 700;
    }

    .date {
      color: #fff;
      background: #222;
      border-radius: 999px;
      padding: 5px 8px;
      font-size: 12px;
      white-space: nowrap;
      flex: 0 0 auto;
    }

    .region {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 7px;
    }

    .format {
      font-size: 13px;
      color: var(--accent);
      margin-bottom: 7px;
      font-weight: 700;
    }

    .details {
      font-size: 13px;
      line-height: 1.35;
      color: #333;
      margin-bottom: 8px;
    }

    .card-link {
      font-size: 13px;
      word-break: break-word;
    }

    .empty {
      padding: 20px;
      text-align: center;
      color: var(--muted);
      border: 1px dashed var(--line);
      border-radius: 16px;
      background: #fafafa;
    }

    .mobile-toggle {
      display: none;
    }

    .balloon {
      font-family: Arial, Helvetica, sans-serif;
      max-width: 310px;
    }

    .balloon h3 {
      margin: 0 0 6px;
      font-size: 17px;
      line-height: 1.2;
    }

    .balloon .meta {
      color: #666;
      font-size: 13px;
      margin-bottom: 7px;
    }

    .balloon .kind {
      color: #0066cc;
      font-weight: 700;
      font-size: 13px;
      margin-bottom: 7px;
    }

    .balloon p {
      margin: 0 0 8px;
      font-size: 13px;
      line-height: 1.35;
    }

    @media (max-width: 900px) {
      .app {
        grid-template-columns: 1fr;
      }

      .sidebar {
        position: absolute;
        left: 10px;
        top: 10px;
        bottom: 10px;
        width: min(420px, calc(100vw - 20px));
        border-radius: 18px;
        border: 1px solid var(--line);
        transform: translateX(-110%);
        transition: transform .2s ease;
      }

      .sidebar.open {
        transform: translateX(0);
      }

      .mobile-toggle {
        display: block;
        position: absolute;
        left: 12px;
        top: 12px;
        z-index: 10;
        border: 0;
        background: #111;
        color: #fff;
        border-radius: 999px;
        padding: 11px 14px;
        font-size: 14px;
        box-shadow: var(--shadow);
      }

      #map {
        height: 100vh;
      }
    }
  </style>
</head>

      <div class="controls">

            <option value="08">Август</option>
            <option value="09">Сентябрь</option>

            <option value="gravel">гревел</option>
            <option value="mtb">MTB / кросс-кантри</option>
            <option value="rogaine">рогейн / приключения</option>
            <option value="road">шоссе / gran fondo</option>
            <option value="tour">велотур</option>
            <option value="other">прочее</option>

        </div>
      </div>

      <div class="stats">

      </div>

      <div class="list" id="eventList"></div>
    </aside>

    <main class="map-wrap">

    let map;
    let clusterer;
    let placemarks = [];
    let activeEventName = null;

    function getMonth(dateString) {
      const parts = dateString.split(".");
      return parts.length > 1 ? parts[1] : "";
    }

    function compareDates(a, b) {
      const [ad, am] = a.date.split(".").map(Number);
      const [bd, bm] = b.date.split(".").map(Number);
      if (am !== bm) return am - bm;
      return ad - bd;
    }

    function getFilteredEvents() {
      const query = document.getElementById("searchInput").value.trim().toLowerCase();
      const month = document.getElementById("monthFilter").value;
      const type = document.getElementById("typeFilter").value;

      return EVENTS
        .filter(event => {
          const haystack = [
            event.region,
            event.name,
            event.format,
            event.details,
            event.date
          ].join(" ").toLowerCase();

          const queryOk = !query || haystack.includes(query);
          const monthOk = !month || getMonth(event.date) === month;
          const typeOk = !type || event.type === type;

          return queryOk && monthOk && typeOk;
        })
        .sort(compareDates);
    }

    function makeBalloon(event) {
      return `
        <div class="balloon">
          <h3>${event.name}</h3>
          <div class="meta">${event.region} · ${event.date}</div>
          <div class="kind">${event.format}</div>
          <p>${event.details}</p>
          <a href="${event.url}" target="_blank" rel="noopener">Открыть страницу</a>
        </div>
      `;
    }

    function makePlacemark(event) {
      const placemark = new ymaps.Placemark(
        event.coords,
        {
          balloonContent: makeBalloon(event),
          hintContent: `${event.date} · ${event.name}`
        },
        {
          preset: getPreset(event.type),
          iconCaptionMaxWidth: "180"
        }
      );

      placemark.events.add("click", function () {
        activeEventName = event.name;
        renderList();
      });

      return placemark;
    }

    function getPreset(type) {
      const presets = {
        bikepacking: "islands#blackBicycleIcon",
        gravel: "islands#blueBicycleIcon",
        mtb: "islands#greenBicycleIcon",
        rogaine: "islands#violetBicycleIcon",
        road: "islands#redBicycleIcon",
        tour: "islands#orangeBicycleIcon",
        other: "islands#grayBicycleIcon"
      };

      return presets[type] || "islands#blueBicycleIcon";
    }

    function renderMap() {
      const filteredEvents = getFilteredEvents();

      clusterer.removeAll();
      placemarks = filteredEvents.map(makePlacemark);
      clusterer.add(placemarks);

      if (filteredEvents.length) {
        const bounds = clusterer.getBounds();
        if (bounds) {
          map.setBounds(bounds, {
            checkZoomRange: true,
            zoomMargin: 45
          });
        }
      }
    }

    function renderList() {
      const list = document.getElementById("eventList");
      const countPill = document.getElementById("countPill");
      const filteredEvents = getFilteredEvents();

      countPill.textContent = `${filteredEvents.length} событий`;
      list.innerHTML = "";

      if (!filteredEvents.length) {
        list.innerHTML = `<div class="empty">Ничего не найдено. Фильтр слишком суров, как Южный Урал в сентябре.</div>`;
        return;
      }

      filteredEvents.forEach(event => {
        const card = document.createElement("article");
        card.className = "card" + (activeEventName === event.name ? " active" : "");

        card.innerHTML = `
          <div class="card-top">
            <h2 class="event-name">${event.name}</h2>
            <span class="date">${event.date}</span>
          </div>
          <div class="region">${event.region}</div>
          <div class="format">${event.format}</div>
          <div class="details">${event.details}</div>
          <a class="card-link" href="${event.url}" target="_blank" rel="noopener">${event.url}</a>
        `;

        card.addEventListener("click", function (e) {
          if (e.target.tagName.toLowerCase() === "a") return;

          activeEventName = event.name;
          renderList();

          map.setCenter(event.coords, 8, {
            duration: 250
          });

          const mark = placemarks.find(item => item.geometry.getCoordinates()[0] === event.coords[0] && item.geometry.getCoordinates()[1] === event.coords[1]);

          if (mark) {
            mark.balloon.open();
          }

          if (window.innerWidth <= 900) {
            document.getElementById("sidebar").classList.remove("open");
          }
        });

        list.appendChild(card);
      });
    }

    function updateAll() {
      renderMap();
      renderList();
    }

    function init() {
      map = new ymaps.Map("map", {
        center: [55.751244, 37.618423],
        zoom: 4,
        controls: ["zoomControl", "typeSelector", "fullscreenControl"]
      });

      clusterer = new ymaps.Clusterer({
        preset: "islands#invertedBlueClusterIcons",
        groupByCoordinates: false,
        clusterDisableClickZoom: false,
        clusterOpenBalloonOnClick: true
      });

      map.geoObjects.add(clusterer);

      document.getElementById("searchInput").addEventListener("input", updateAll);
      document.getElementById("monthFilter").addEventListener("change", updateAll);
      document.getElementById("typeFilter").addEventListener("change", updateAll);

      document.getElementById("mobileToggle").addEventListener("click", function () {
        document.getElementById("sidebar").classList.toggle("open");
      });

      updateAll();
    }

    ymaps.ready(init);
  </script>
