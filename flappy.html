<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flappy Скумбрия</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0d1117;
      color: #c9d1d9;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 12px;
    }

    .wrap {
      width: min(100vw, 960px);
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(280px, 480px) minmax(220px, 320px);
      gap: 14px;
      align-items: start;
    }

    .left {
      min-width: 0;
    }

    .right {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 16px;
      padding: 14px;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      gap: 10px;
      flex-wrap: wrap;
    }

    .title {
      font-size: 24px;
      font-weight: 700;
    }

    .hint {
      opacity: 0.8;
      font-size: 14px;
      margin-top: 4px;
    }

    canvas {
      width: 100%;
      height: auto;
      display: block;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
      cursor: pointer;
      background: linear-gradient(#9fd1ff, #dff3ff 70%);
    }

    button, input {
      background: transparent;
      color: inherit;
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 10px;
      padding: 8px 12px;
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    button:hover {
      background: rgba(255,255,255,0.06);
    }

    .row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    .controls {
      margin-top: 10px;
      display: flex;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
      font-size: 14px;
      opacity: 0.9;
    }

    .panel-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .scoreline {
      margin-bottom: 10px;
      opacity: 0.9;
    }

    .leaderboard {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    .leaderboard th,
    .leaderboard td {
      text-align: left;
      padding: 6px 4px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      vertical-align: top;
    }

    .leaderboard th:nth-child(1),
    .leaderboard td:nth-child(1) {
      width: 28px;
    }

    .leaderboard th:nth-child(3),
    .leaderboard td:nth-child(3) {
      width: 52px;
      text-align: right;
    }

    .small {
      opacity: 0.75;
      font-size: 13px;
    }

    @media (max-width: 820px) {
      .layout {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="layout">
      <div class="left">
        <div class="top">
          <div>
            <div class="title">Flappy Скумбрия</div>
            <div class="hint">Пробел, клик или тап — скумбрия машет плавником</div>
          </div>
          <div class="row">
            <input id="nickname" type="text" maxlength="20" placeholder="твоя скумбрия" />
            <button id="restartBtn">заново</button>
          </div>
        </div>

        <canvas id="game" width="480" height="720"></canvas>

        <div class="controls">
          <div>Цель: не врезаться в трубы и не нырнуть в речку мордой</div>
          <div id="bestWrap">Лучший счет: 0</div>
        </div>
      </div>

      <div class="right">
        <div class="panel-title">Топ скумбрий</div>
        <div class="scoreline small">Локальный лидерборд в этом браузере</div>
        <table class="leaderboard">
          <thead>
            <tr>
              <th>#</th>
              <th>ник</th>
              <th>счет</th>
            </tr>
          </thead>
          <tbody id="leaderboardBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const restartBtn = document.getElementById('restartBtn');
    const bestWrap = document.getElementById('bestWrap');
    const nicknameInput = document.getElementById('nickname');
    const leaderboardBody = document.getElementById('leaderboardBody');

    const W = canvas.width;
    const H = canvas.height;
    const riverH = 110;
    const pipeWidth = 76;
    const pipeGap = 205;
    const pipeSpacing = 235;
    const gravity = 0.34;
    const flapPower = -6.3;
    const pipeSpeed = 2.0;

    const wisdoms = [
      "Если можно было не лететь, значит надо было лететь.",
      "Стая не бросает. Даже если ты еле машешь плавником.",
      "Пробил трубу — значит маршрут был правильный.",
      "Остановился — значит слабый. Упал в реку — значит философ.",
      "Подъёмы не обсуждаются. Подъёмы принимаются.",
      "Если ты не устал — ты не доехал.",
      "Еда на остановке вкуснее в 3 раза.",
      "Ты не знаешь куда летишь — значит всё идёт по плану.",
      "Грязь — это не проблема. Это состояние.",
      "Если можно было не ехать — значит надо было ехать.",
      "Сильная скумбрия не та, что выебывается, а та, что доезжает.",
      "Лучший апгрейд — мозг того, кто машет плавником.",
      "Не спорь с гравитацией. Она ебет стабильнее тебя.",
      "Чем длиннее маршрут, тем короче понты.",
      "Ветер в лицо — бесплатная проверка характера.",
      "Лох на транспорте не перестает быть лохом.",
      "Если все пошло по пизде, хотя бы держи курс ровно.",
      "Скумбрийный стиль — это выжить, поржать и пожрать.",
      "Пока ты живой и летишь, маршрут считается хорошим.",
      "Иногда вся мудрость дня помещается в одном действии: не тупить."
    ];

    let game;
    let bestScore = Number(localStorage.getItem('skumbria_flappy_best') || 0);
    let scores = JSON.parse(localStorage.getItem('skumbria_flappy_scores') || '[]');

    const savedNickname = localStorage.getItem('skumbria_flappy_nick');
    if (savedNickname) nicknameInput.value = savedNickname;

    nicknameInput.addEventListener('input', () => {
      localStorage.setItem('skumbria_flappy_nick', nicknameInput.value.trim());
    });

    bestWrap.textContent = `Лучший счет: ${bestScore}`;

    function renderLeaderboard() {
      leaderboardBody.innerHTML = "";
      const top = [...scores].sort((a, b) => b.score - a.score).slice(0, 15);

      if (!top.length) {
        leaderboardBody.innerHTML = `<tr><td colspan="3" class="small">пока пусто. будь первой копченой скумбрией.</td></tr>`;
        return;
      }

      top.forEach((item, index) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${index + 1}</td>
          <td>${escapeHtml(item.name || 'безымянная скумбрия')}</td>
          <td>${item.score}</td>
        `;
        leaderboardBody.appendChild(tr);
      });
    }

    function escapeHtml(str) {
      return String(str)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function saveScore(score) {
      const name = nicknameInput.value.trim() || 'безымянная скумбрия';
      scores.push({
        name,
        score,
        createdAt: Date.now()
      });
      scores.sort((a, b) => b.score - a.score || a.createdAt - b.createdAt);
      scores = scores.slice(0, 30);
      localStorage.setItem('skumbria_flappy_scores', JSON.stringify(scores));
      renderLeaderboard();
    }

    function resetGame() {
      game = {
        started: false,
        over: false,
        score: 0,
        frame: 0,
        wisdomText: "",
        wisdomUntil: 0,
        fish: {
          x: 118,
          y: H / 2 - 40,
          vy: 0,
          r: 22,
          rot: 0,
        },
        pipes: [],
      };
    }

    function addPipe(x) {
      const marginTop = 90;
      const playableH = H - riverH - 180;
      const gapY = marginTop + Math.random() * playableH;
      game.pipes.push({ x, gapY, passed: false });
    }

    function ensurePipes() {
      if (!game.pipes.length) {
        addPipe(W + 120);
        addPipe(W + 120 + pipeSpacing);
        addPipe(W + 120 + pipeSpacing * 2);
      }
      const last = game.pipes[game.pipes.length - 1];
      if (last.x < W - pipeSpacing) addPipe(last.x + pipeSpacing);
    }

    function flap() {
      if (game.over) {
        resetGame();
        return;
      }
      if (!game.started) game.started = true;
      game.fish.vy = flapPower;
    }

    function circleRectCollision(cx, cy, cr, rx, ry, rw, rh) {
      const nearestX = Math.max(rx, Math.min(cx, rx + rw));
      const nearestY = Math.max(ry, Math.min(cy, ry + rh));
      const dx = cx - nearestX;
      const dy = cy - nearestY;
      return dx * dx + dy * dy < cr * cr;
    }

    function showRandomWisdom() {
      const text = wisdoms[Math.floor(Math.random() * wisdoms.length)];
      game.wisdomText = text;
      game.wisdomUntil = performance.now() + 2600;
    }

    function update() {
      game.frame++;
      ensurePipes();

      if (!game.started || game.over) return;

      const f = game.fish;
      f.vy += gravity;
      f.y += f.vy;
      f.rot = Math.max(-0.55, Math.min(1.1, f.vy * 0.08));

      for (const pipe of game.pipes) {
        pipe.x -= pipeSpeed;

        const topH = pipe.gapY - pipeGap / 2;
        const bottomY = pipe.gapY + pipeGap / 2;
        const bottomH = H - riverH - bottomY;

        if (
          circleRectCollision(f.x, f.y, f.r, pipe.x, 0, pipeWidth, topH) ||
          circleRectCollision(f.x, f.y, f.r, pipe.x, bottomY, pipeWidth, bottomH)
        ) {
          game.over = true;
        }

        if (!pipe.passed && pipe.x + pipeWidth < f.x) {
          pipe.passed = true;
          game.score++;

          if (game.score > bestScore) {
            bestScore = game.score;
            localStorage.setItem('skumbria_flappy_best', String(bestScore));
            bestWrap.textContent = `Лучший счет: ${bestScore}`;
          }

          if (game.score % 2 === 0) {
            showRandomWisdom();
          }
        }
      }

      game.pipes = game.pipes.filter(p => p.x > -pipeWidth - 40);

      if (f.y + f.r > H - riverH || f.y - f.r < 0) {
        game.over = true;
      }

      if (game.over) {
        saveScore(game.score);
      }
    }

    function drawMountains() {
      ctx.fillStyle = '#9bb0c2';
      ctx.beginPath();
      ctx.moveTo(0, H - riverH - 120);
      ctx.lineTo(70, H - riverH - 230);
      ctx.lineTo(150, H - riverH - 140);
      ctx.lineTo(220, H - riverH - 270);
      ctx.lineTo(310, H - riverH - 120);
      ctx.lineTo(390, H - riverH - 220);
      ctx.lineTo(W, H - riverH - 130);
      ctx.lineTo(W, H - riverH);
      ctx.lineTo(0, H - riverH);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = '#7e97ab';
      ctx.beginPath();
      ctx.moveTo(0, H - riverH - 60);
      ctx.lineTo(90, H - riverH - 170);
      ctx.lineTo(200, H - riverH - 80);
      ctx.lineTo(290, H - riverH - 190);
      ctx.lineTo(400, H - riverH - 70);
      ctx.lineTo(W, H - riverH - 110);
      ctx.lineTo(W, H - riverH);
      ctx.lineTo(0, H - riverH);
      ctx.closePath();
      ctx.fill();
    }

    function drawRiver() {
      ctx.fillStyle = '#4d95c7';
      ctx.fillRect(0, H - riverH, W, riverH);

      ctx.strokeStyle = 'rgba(255,255,255,0.25)';
      ctx.lineWidth = 2;
      for (let i = 0; i < 5; i++) {
        const y = H - riverH + 20 + i * 18;
        ctx.beginPath();
        for (let x = 0; x <= W; x += 20) {
          const waveY = y + Math.sin((x + game.frame * 3 + i * 15) * 0.03) * 3;
          if (x === 0) ctx.moveTo(x, waveY);
          else ctx.lineTo(x, waveY);
        }
        ctx.stroke();
      }
    }

    function drawBackground() {
      const cloud = (x, y, s = 1) => {
        ctx.fillStyle = 'rgba(255,255,255,0.88)';
        ctx.beginPath();
        ctx.arc(x, y, 14 * s, 0, Math.PI * 2);
        ctx.arc(x + 16 * s, y - 6 * s, 18 * s, 0, Math.PI * 2);
        ctx.arc(x + 35 * s, y, 15 * s, 0, Math.PI * 2);
        ctx.fill();
      };

      drawMountains();
      cloud(60, 95, 1);
      cloud(255, 150, 1.2);
      cloud(350, 80, 0.9);
      drawRiver();
    }

    function drawPipe(x, gapY) {
      const topH = gapY - pipeGap / 2;
      const bottomY = gapY + pipeGap / 2;
      const bottomH = H - riverH - bottomY;

      ctx.fillStyle = '#2d8f3b';
      ctx.fillRect(x, 0, pipeWidth, topH);
      ctx.fillRect(x, bottomY, pipeWidth, bottomH);

      ctx.fillStyle = '#36aa47';
      ctx.fillRect(x - 4, topH - 20, pipeWidth + 8, 20);
      ctx.fillRect(x - 4, bottomY, pipeWidth + 8, 20);
    }

    function drawFish() {
      const f = game.fish;
      ctx.save();
      ctx.translate(f.x, f.y);
      ctx.rotate(f.rot);

      const bodyGradient = ctx.createLinearGradient(-28, -12, 28, 16);
      bodyGradient.addColorStop(0, '#5d4638');
      bodyGradient.addColorStop(0.45, '#8a684d');
      bodyGradient.addColorStop(1, '#3c2d24');

      ctx.fillStyle = bodyGradient;
      ctx.beginPath();
      ctx.ellipse(0, 0, 30, 20, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = 'rgba(20,14,10,0.35)';
      ctx.lineWidth = 2;
      for (let i = -12; i <= 12; i += 8) {
        ctx.beginPath();
        ctx.moveTo(-18, i);
        ctx.lineTo(20, i - 3);
        ctx.stroke();
      }

      ctx.fillStyle = '#3b2c24';
      ctx.beginPath();
      ctx.moveTo(-28, 0);
      ctx.lineTo(-46, -12);
      ctx.lineTo(-46, 12);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = '#4a382d';
      ctx.beginPath();
      ctx.moveTo(0, -10);
      ctx.lineTo(-8, -27);
      ctx.lineTo(8, -14);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(16, -4, 5.4, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#111';
      ctx.beginPath();
      ctx.arc(18, -4, 2.3, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = '#1a120d';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(24, 6, 5, 0.3, 2.8);
      ctx.stroke();

      ctx.restore();
    }

    function drawWisdomOverlay() {
      if (!game.wisdomText || performance.now() > game.wisdomUntil) return;

      const pad = 14;
      const maxWidth = W - 50;
      const x = 25;
      const y = 90;

      ctx.font = '16px Arial';
      const lines = wrapText(game.wisdomText, maxWidth);
      const boxH = lines.length * 22 + pad * 2;

      ctx.fillStyle = 'rgba(0,0,0,0.45)';
      ctx.fillRect(x, y, maxWidth, boxH);

      ctx.fillStyle = '#fff';
      lines.forEach((line, i) => {
        ctx.fillText(line, x + pad, y + 24 + i * 22);
      });
    }

    function wrapText(text, maxWidth) {
      const words = text.split(' ');
      const lines = [];
      let line = '';

      for (const word of words) {
        const testLine = line ? `${line} ${word}` : word;
        const width = ctx.measureText(testLine).width;
        if (width > maxWidth - 28 && line) {
          lines.push(line);
          line = word;
        } else {
          line = testLine;
        }
      }
      if (line) lines.push(line);
      return lines;
    }

    function drawHud() {
      ctx.fillStyle = 'rgba(0,0,0,0.18)';
      ctx.fillRect(12, 12, 120, 44);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 28px Arial';
      ctx.fillText(String(game.score), 24, 42);

      drawWisdomOverlay();

      if (!game.started && !game.over) {
        ctx.fillStyle = 'rgba(0,0,0,0.35)';
        ctx.fillRect(36, 210, W - 72, 140);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 28px Arial';
        ctx.fillText('ТЫК / ПРОБЕЛ', 120, 252);
        ctx.font = '20px Arial';
        ctx.fillText('запусти копченую скумбрию', 88, 286);
        ctx.fillText('и не дай ей ебнуться в трубу', 76, 316);
      }

      if (game.over) {
        ctx.fillStyle = 'rgba(0,0,0,0.45)';
        ctx.fillRect(52, 180, W - 104, 200);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 34px Arial';
        ctx.fillText('СКУМБРИЯ ПАЛА', 90, 232);
        ctx.font = '22px Arial';
        ctx.fillText(`счет: ${game.score}`, 170, 278);
        ctx.fillText(`лучший: ${bestScore}`, 152, 312);
        ctx.font = '18px Arial';
        ctx.fillText('тыкни или жми пробел для рестарта', 82, 352);
      }
    }

    function draw() {
      ctx.clearRect(0, 0, W, H);
      drawBackground();
      for (const pipe of game.pipes) drawPipe(pipe.x, pipe.gapY);
      drawFish();
      drawHud();
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        e.preventDefault();
        flap();
      }
    });

    canvas.addEventListener('pointerdown', flap);
    restartBtn.addEventListener('click', () => resetGame());

    renderLeaderboard();
    resetGame();
    loop();
  </script>
</body>
</html>
