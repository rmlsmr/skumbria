<!DOCTYPE html>
<html lang="ru">
<head>
  <link rel="icon" href="favicon.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мудрость скумбрии</title>

  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      color: #222;
    }

    body.dark {
      background: #0d1117;
      color: #c9d1d9;
    }

    .wrap {
      max-width: 700px;
      margin: 0 auto;
    }

    a {
      text-decoration: none;
      color: #0066cc;
    }

    a:hover {
      text-decoration: underline;
    }

    body.dark a {
      color: #58a6ff;
    }

    .theme-toggle {
      position: fixed;
      top: 15px;
      right: 15px;
      cursor: pointer;
      font-size: 20px;
      user-select: none;
    }

    button {
      margin-top: 20px;
      margin-right: 10px;
      padding: 10px 14px;
      font: inherit;
      border: 1px solid #999;
      background: transparent;
      color: inherit;
      cursor: pointer;
      border-radius: 6px;
    }

    button:active {
      transform: scale(0.97);
    }

    body.dark button {
      border-color: #555;
    }

    .top-links {
      margin-bottom: 20px;
    }

    .wisdom-box {
      margin-top: 25px;
      padding: 18px;
      border-radius: 8px;
      background: rgba(255,255,255,0.45);
      min-height: 110px;
      line-height: 1.5;
      font-size: 22px;
    }

    body.dark .wisdom-box {
      background: rgba(255,255,255,0.04);
    }

    .hint {
      margin-top: 10px;
      opacity: 0.8;
    }

    .meta {
      margin-top: 12px;
      opacity: 0.8;
      font-size: 14px;
      word-break: break-all;
    }
  </style>
</head>
<body>
<div class="theme-toggle" onclick="toggleTheme()" id="themeIcon">🌙</div>

<div class="wrap">
  <div class="top-links">
    <a href="index.html">назад</a>
  </div>

  <h1>Мудрость скумбрии</h1>
  <p>Нажми кнопку и получи скумбрийную истину.</p>

  <button type="button" onclick="getRandomWisdom()" id="wisdomBtn">получить мудрость</button>
  <button type="button" onclick="shareWisdom()" id="shareBtn" style="display:none;">поделиться мудростью</button>

  <div class="wisdom-box" id="wisdomBox">скумбрия молчит, пока ты не нажмешь кнопку</div>
  <div class="meta" id="wisdomMeta"></div>
  <div class="hint">скумбрия, велосипед, жизнь и немного внутреннего копчения</div>
</div>

<script src="wisdoms.js"></script>
<script>
  const icon = document.getElementById("themeIcon");
  const wisdomBox = document.getElementById("wisdomBox");
  const wisdomBtn = document.getElementById("wisdomBtn");
  const shareBtn = document.getElementById("shareBtn");
  const wisdomMeta = document.getElementById("wisdomMeta");

  let currentWisdom = "";
  let currentWisdomId = null;

  function setIcon() {
    icon.textContent = document.body.classList.contains("dark") ? "☀️" : "🌙";
  }

  function toggleTheme() {
    document.body.classList.toggle("dark");
    localStorage.setItem("theme", document.body.classList.contains("dark") ? "dark" : "light");
    setIcon();
  }

  if (localStorage.getItem("theme") === "dark") {
    document.body.classList.add("dark");
  }

  setIcon();

  const buttonTexts = [
    "получить мудрость",
    "получить по яйцам",
    "получить пирожок",
    "получить скумбрию",
    "получить велобазу",
    "получить копчение",
    "получить леща",
    "получить наставление",
    "получить рыбный совет",
    "получить в табло жизнью"
  ];

  function randomButtonText() {
    const randomIndex = Math.floor(Math.random() * buttonTexts.length);
    wisdomBtn.textContent = buttonTexts[randomIndex];
  }

  function setWisdomByIndex(index) {
    if (!Array.isArray(wisdoms) || wisdoms.length === 0) {
      wisdomBox.textContent = "мудрости куда-то уплыли";
      wisdomMeta.textContent = "";
      shareBtn.style.display = "none";
      return;
    }

    if (index < 0 || index >= wisdoms.length) {
      wisdomBox.textContent = "такой мудрости не существует, рыбина";
      wisdomMeta.textContent = "";
      shareBtn.style.display = "none";
      return;
    }

    currentWisdomId = index + 1;
    currentWisdom = wisdoms[index];
    wisdomBox.textContent = currentWisdom;
    wisdomMeta.textContent = `мудрость №${currentWisdomId} • https://skumbria.su/mudro.html?id=${currentWisdomId}`;
    shareBtn.style.display = "inline-block";

    const url = new URL(window.location.href);
    url.searchParams.set("id", currentWisdomId);
    history.replaceState(null, "", url.toString());
  }

  function getRandomWisdom() {
    if (!Array.isArray(wisdoms) || wisdoms.length === 0) return;
    const randomIndex = Math.floor(Math.random() * wisdoms.length);
    setWisdomByIndex(randomIndex);
    randomButtonText();
  }

  function shareWisdom() {
    if (!currentWisdom || !currentWisdomId) return;

    const shareUrl = `https://skumbria.su/mudro.html?id=${currentWisdomId}`;
    const text = `Мудрость скумбрии №${currentWisdomId}: ${currentWisdom}`;

    const tgUrl = `https://t.me/share/url?url=${encodeURIComponent(shareUrl)}&text=${encodeURIComponent(text)}`;
    window.open(tgUrl, "_blank");
  }

  function loadFromUrl() {
    const params = new URLSearchParams(window.location.search);
    const id = parseInt(params.get("id"), 10);

    if (!isNaN(id)) {
      setWisdomByIndex(id - 1);
    } else {
      randomButtonText();
    }
  }

  loadFromUrl();
</script>
</body>
</html>
