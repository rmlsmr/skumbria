<!DOCTYPE html>
<html lang="ru">
<head>
  <link rel="icon" href="favicon.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мудрость скумбрии</title>

  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      color: #222;
    }

    body.dark {
      background: #0d1117;
      color: #c9d1d9;
    }

    .wrap {
      max-width: 700px;
      margin: 0 auto;
    }

    a {
      text-decoration: none;
      color: #0066cc;
    }

    a:hover {
      text-decoration: underline;
    }

    body.dark a {
      color: #58a6ff;
    }

    .theme-toggle {
      position: fixed;
      top: 15px;
      right: 15px;
      cursor: pointer;
      font-size: 20px;
      user-select: none;
    }

    button {
      margin-top: 20px;
      padding: 10px 14px;
      font: inherit;
      border: 1px solid #999;
      background: transparent;
      color: inherit;
      cursor: pointer;
      border-radius: 6px;
    }

    button:active {
      transform: scale(0.97);
    }

    body.dark button {
      border-color: #555;
    }

    .top-links {
      margin-bottom: 20px;
    }

    .wisdom-box {
      margin-top: 25px;
      padding: 18px;
      border-radius: 8px;
      background: rgba(255,255,255,0.45);
      min-height: 110px;
      line-height: 1.5;
      font-size: 22px;
    }

    body.dark .wisdom-box {
      background: rgba(255,255,255,0.04);
    }

    .hint {
      margin-top: 10px;
      opacity: 0.8;
    }
  </style>
</head>
<body>
<div class="theme-toggle" onclick="toggleTheme()" id="themeIcon">🌙</div>

<div class="wrap">
  <div class="top-links">
    <a href="index.html">назад</a>
  </div>

  <h1>Мудрость скумбрии</h1>
  <p>Нажми кнопку и получи скумбрийную истину.</p>

  <button type="button" onclick="getWisdom()">получить мудрость</button>

  <div class="wisdom-box" id="wisdomBox">скумбрия молчит, пока ты не нажмешь кнопку</div>
  <div class="hint">скумбрия, велосипед, жизнь и немного внутреннего копчения</div>
</div>

<script>
  const icon = document.getElementById("themeIcon");
  const wisdomBox = document.getElementById("wisdomBox");

  function setIcon() {
    icon.textContent = document.body.classList.contains("dark") ? "☀️" : "🌙";
  }

  function toggleTheme() {
    document.body.classList.toggle("dark");
    localStorage.setItem("theme", document.body.classList.contains("dark") ? "dark" : "light");
    setIcon();
  }

  if (localStorage.getItem("theme") === "dark") {
    document.body.classList.add("dark");
  }

  setIcon();

  const wisdoms = [
    "Если на старте сказали \"лайт\", готовься страдать как копченая скумбрия на солнце.",
    "Не всякий, кто купил велосипед, перестал быть лохом.",
    "Сильная скумбрия не та, что выебывается, а та, что доезжает.",
    "Кто едет без насоса, тот верит не в себя, а в чудо. Лох.",
    "Если в группе молчат про яму, рядом не косяк, а банда шпрот-предателей.",
    "Лучший апгрейд велосипеда — мозг того, кто на нем едет.",
    "Не верь человеку, который говорит \"да там всего один бугор\".",
    "Прокол — это не трагедия. Трагедия — понять, что ремкомплект остался дома.",
    "Когда тяжело, выясняется кто ты: скумбрия, шпрота или просто лох на колесах.",
    "Сначала доедь, потом рассказывай как ты доминировал.",
    "Если взял мало воды, значит взял много самоуверенности.",
    "На встречном ветре слетает все: маска, понты и разговоры про форму.",
    "Скумбрия без еды быстро становится философом, но ненадолго.",
    "Не всякий косяк команда. Иногда это просто толпа шумных шпрот.",
    "Тот, кто орет про темп, часто первым и отваливается.",
    "Чем длиннее маршрут, тем короче понты.",
    "Если ты не загрузил трек, значит загрузил судьбу лишней работой.",
    "Велосипед прощает многое, но тупость записывает в долг.",
    "Не путай высокий каденс с паникой.",
    "Нормальная скумбрия смазывает цепь до того, как она начинает петь матом.",
    "Если апхилл тебя унизил, не расстраивайся. Он для этого и существует.",
    "Сначала батончик, потом экзистенциализм.",
    "На гравии все равны: и карбон, и понты, и чужие иллюзии.",
    "Когда кончилась еда, начинается настоящая биография человека.",
    "Сильный не тот, кто вырвался вперед. Сильный тот, кто не сделал из покатушки помойку.",
    "Скумбрийный стиль — это доехать, помочь, поржать и пожрать.",
    "Если в дальняке тебе стало скучно, значит ты еще не устал по-настоящему.",
    "Плохой темп в начале — это кредит под адский процент.",
    "Не каждый красивый маршрут добрый. Иногда это просто ловушка с видами.",
    "Кто не взял запаску, тот взял урок.",
    "Сначала проверяй тормоза, потом уже свои амбиции.",
    "Лох на велосипеде не перестает быть лохом. Он просто быстрее приезжает к своим ошибкам.",
    "Чем дальше от дома, тем честнее разговор с собой.",
    "Если группа не ждет отставшего, это не косяк, а рыбный позор.",
    "У хорошей скумбрии всегда есть план Б, насос и немного злости.",
    "Никто не обязан ждать твою истерику, но нормальные люди ждут твой прокол.",
    "В жизни как в покатушке: не надо стартовать на все деньги.",
    "Если болит жопа, возможно это не судьба, а седло.",
    "Ветер в лицо — это природа говорит: \"ну че, лох, поехали честно\".",
    "Кто весь маршрут молчал, тот либо мудрый, либо уже умер внутри.",
    "Лучше быть жирной скумбрией с ресурсом, чем сухой шпротой с амбициями.",
    "Не всякий спуск безопасен. Некоторые просто маскируются под подарок.",
    "Когда человек говорит \"да я на морально-волевых\", обычно у него просто кончилась еда.",
    "Если на старте все улыбаются, а через час молчат, значит темп подобран по заветам ада.",
    "Умная скумбрия знает: не каждый бугор надо брать в атаку.",
    "Самый дорогой апгрейд — это опыт. Самый больной — тоже.",
    "Велоформа не делает тебя быстрым. Но помогает страдать эстетичнее.",
    "Скумбрийная зрелость — это когда ты уже не доказываешь, а просто доезжаешь.",
    "Если ты весь маршрут всех дергал, а потом сдох — это не геройство, а комедия.",
    "Не спорь с гравитацией. Она ебет стабильнее тебя.",
    "Когда маршрут называется \"немного катнуть\", готовь прощальное письмо ногам.",
    "Если с утра все пошло не так, хотя бы не добавляй к этому прокол своим долбоебизмом.",
    "Чем громче человек про опыт, тем вероятнее он забыл насос.",
    "Сначала научись ехать в группе, потом уже мечтай быть первым.",
    "Когда нет сил, выясняется, кто крутил ногами, а кто пиздел в чате.",
    "Если после 20 км ты уже ненавидишь мир, возможно ты просто не позавтракал.",
    "Иногда лучший темп — тот, при котором ты еще можешь мыслить, а не только хрипеть.",
    "Скумбрия не боится дождя. Она просто становится аккуратнее и злее.",
    "Кто хотел понтануться на старте, тот часто фоткается на обочине.",
    "Если цепь скрипит, не молись. Ищи смазку, лох.",
    "Не каждый лидер ведет. Некоторые просто первыми творят хуйню.",
    "Хороший маршрут — это когда домой хочется вернуться еще раз, а не вызвать МЧС.",
    "Если ехать слишком быстро в начале, потом будешь духовно бедным.",
    "Внутренний стержень хорош, но батончик в кармане надежнее.",
    "Сначала дыши, потом страдай, потом снова дыши.",
    "На велосипеде очень быстро видно, кто человек, а кто только экипировка.",
    "Кто не умеет есть на ходу, тот скоро научится страдать на ходу.",
    "Если впереди мост, мокрая разметка и ты без мозгов — соболезную.",
    "Мудрая скумбрия не паникует. Она просто тихо матерится и решает проблему.",
    "Когда тебе говорят \"да там плоскач\", где-то уже смеется апхилл.",
    "Плохое седло делает из человека философа боли.",
    "Сначала настрой велосипед, потом уже себя мессией дальняка.",
    "Уставший человек показывает характер. Голодный — биографию рода.",
    "Не надо побеждать каждый подъем. Иногда надо просто не умереть красиво.",
    "Если ты не предупредил про яму, ты не брат, а подводная мина.",
    "Кто умеет ехать ровно, тот обычно и живет без лишней суеты.",
    "Не всякий, кто быстро стартует, вообще доедет.",
    "Прокатиться и выжить — это уже хороший план.",
    "Если ты опять забыл насос, это уже не случайность, а твоя религия.",
    "Жизнь коротка. Асфальт твердый. Шлем полезный.",
    "Тот, кто умеет вовремя скинуть передачу, обычно умеет и вовремя заткнуться.",
    "Скумбрийный авторитет не шумит. Он просто не косячит.",
    "Если ты не можешь говорить на темпе, возможно это не твой темп.",
    "Когда группа едет красиво, значит кто-то в ней думает головой.",
    "Не надо ехать быстрее, чем работает твой мозг.",
    "Лучше потерять минуту на остановке, чем лицо на спуске.",
    "Если тебя тянет выпендриться, сначала спроси у коленей их мнение.",
    "Дальняк любит спокойных и жрет нервных.",
    "Хорошая скумбрия берет с собой не только воду, но и чувство меры.",
    "Если все пошло по пизде, хотя бы держи руль ровно.",
    "Не каждый, кто молчит, мудрый. Иногда он просто уже умер от темпа.",
    "Пока ты живой и доехал, маршрут считается хорошим.",
    "Кто едет без света ночью, тот доверяет небу слишком много.",
    "Если на старте хочется домой, возможно это и есть мудрость.",
    "В гору не надо побеждать других. Надо не сломать себя.",
    "Когда косяк хороший, даже страдать как-то уютнее.",
    "Скумбрия знает: лучше лишний батончик, чем лишняя трагедия.",
    "Тот, кто умеет ждать слабого, обычно и сам не совсем говно.",
    "Самые опасные слова в веложизни: \"да там рядом\".",
    "Если ты снова попал в мясо после слов \"лайт\", значит ничему не учишься, рыбина.",
    "Иногда вся мудрость дня помещается в одном действии: не тупить."
  ];

  function getWisdom() {
    const randomIndex = Math.floor(Math.random() * wisdoms.length);
    wisdomBox.textContent = wisdoms[randomIndex];
  }
</script>
</body>
</html>
